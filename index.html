<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Ahmed Construction — Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f86f7">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface2: #1f2333;
    --surface3: #252a3a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #eef0f6;
    --text2: #8b92a9;
    --text3: #5a6175;
    --accent: #4f86f7;
    --accent2: #2563eb;
    --green: #22d07a;
    --green-bg: rgba(34,208,122,0.1);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.1);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.1);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.1);
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.1);
    --radius: 10px;
    --radius-lg: 14px;
    --font: 'Sora', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    font-size: 14px;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .sidebar-logo .sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    font-family: var(--mono);
  }
  .nav-section {
    padding: 14px 10px 6px;
  }
  .nav-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    color: var(--text3);
    text-transform: uppercase;
    padding: 0 8px;
    margin-bottom: 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item i { font-size: 16px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(79,134,247,0.15); color: var(--accent); }
  .nav-item.active i { color: var(--accent); }
  .nav-item .badge {
    margin-left: auto;
    background: var(--surface3);
    color: var(--text3);
    font-size: 10px;
    font-family: var(--mono);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .nav-item.raghu-link { color: var(--amber); }
  .nav-item.raghu-link.active { background: var(--amber-bg); color: var(--amber); }

  /* MAIN */
  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .topbar-title span { color: var(--text2); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { background: var(--surface3); }
  .btn-primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-danger { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* PAGE CONTENT */
  .page { display: none; padding: 24px; }
  .page.active { display: block; }

  /* STAT CARDS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .stat-card .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-card .label i { font-size: 14px; }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    font-family: var(--mono);
    letter-spacing: -0.5px;
  }
  .stat-card .sub-value {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    font-family: var(--mono);
  }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .table-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .table-header h3 { font-size: 14px; font-weight: 600; flex: 1; }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text3);
    text-transform: uppercase;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  td {
    padding: 11px 18px;
    font-size: 13px;
    color: var(--text);
  }
  td.mono { font-family: var(--mono); }
  .empty-row td {
    text-align: center;
    padding: 32px;
    color: var(--text3);
    font-size: 13px;
  }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-cash { background: var(--green-bg); color: var(--green); }
  .badge-online { background: rgba(79,134,247,0.15); color: var(--accent); }
  .badge-credit { background: var(--purple-bg); color: var(--purple); }
  .badge-paid { background: var(--green-bg); color: var(--green); }
  .badge-pending { background: var(--amber-bg); color: var(--amber); }
  .badge-partial { background: var(--teal-bg); color: var(--teal); }
  .badge-contractor { background: var(--amber-bg); color: var(--amber); }
  .badge-material { background: rgba(79,134,247,0.15); color: var(--accent); }
  .badge-labour { background: var(--purple-bg); color: var(--purple); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-head h3 { font-size: 15px; font-weight: 600; flex: 1; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.3px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* RAGHU PAGE */
  .raghu-header {
    background: linear-gradient(135deg, #1a1500 0%, #1f1800 100%);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .raghu-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--amber-bg);
    border: 2px solid var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--amber);
    flex-shrink: 0;
  }
  .raghu-info h2 { font-size: 18px; font-weight: 700; color: var(--amber); }
  .raghu-info p { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .balance-box {
    margin-left: auto;
    text-align: right;
  }
  .balance-box .bal-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .balance-box .bal-amount {
    font-size: 24px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--amber);
    margin-top: 2px;
  }

  /* CATEGORY FILTER */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    transition: all 0.15s;
    font-family: var(--font);
  }
  .filter-btn:hover { color: var(--text); border-color: var(--text3); }
  .filter-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  /* PROGRESS */
  .progress-bar {
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s;
  }

  /* SUMMARY SECTION */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title i { font-size: 16px; }

  /* DASHBOARD CHARTS */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .chart-card h4 { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bar-label { font-size: 12px; color: var(--text2); width: 100px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-val { font-size: 12px; font-family: var(--mono); color: var(--text2); width: 70px; text-align: right; flex-shrink: 0; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.25s;
    z-index: 2000;
    pointer-events: none;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    border-radius: 5px;
    transition: color 0.15s;
    font-size: 15px;
  }
  .delete-btn:hover { color: var(--red); }
  .edit-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    border-radius: 5px;
    transition: color 0.15s;
    font-size: 15px;
  }
  .edit-btn:hover { color: var(--accent); }
  .action-btns { display: flex; align-items: center; gap: 2px; }
  .status-toggle {
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    border-radius: 5px;
    padding: 2px 4px;
    transition: all 0.15s;
    font-size: 11px;
    font-family: var(--font);
  }
  .status-toggle:hover { border-color: var(--green); background: var(--green-bg); }
  .status-toggle i { font-size: 12px; }

  /* PARTIAL PAYMENT BOX */
  .partial-box {
    background: var(--amber-bg);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    display: none;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .partial-box.show { display: flex; }
  .partial-box .pb-label { font-size: 12px; color: var(--amber); font-weight: 600; white-space: nowrap; }
  .partial-box .pb-remaining {
    font-size: 13px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--red);
    margin-left: auto;
  }
  .remaining-badge {
    display: inline-block;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--red);
    background: var(--red-bg);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
  }
  .paid-badge {
    display: inline-block;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--green);
    background: var(--green-bg);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
  }

  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    outline: none;
    width: 200px;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-wrap { position: relative; }
  .search-wrap i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }

  /* DRIVE PANEL */
  .drive-panel {
    margin: 10px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px;
  }
  .drive-panel .dp-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.7px;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .drive-status {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 8px;
    line-height: 1.5;
    font-family: var(--mono);
  }
  .drive-status.connected { color: var(--green); }
  .drive-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    border: 1px solid var(--border2);
    background: var(--surface3);
    color: var(--text2);
    transition: all 0.15s;
    margin-bottom: 5px;
  }
  .drive-btn:hover { color: var(--text); background: var(--surface); }
  .drive-btn.primary { background: rgba(79,134,247,0.15); border-color: var(--accent); color: var(--accent); }
  .drive-btn.success { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .drive-btn i { font-size: 14px; }
  .drive-btn span { display: block; }
  .drive-modal { max-width: 440px; }
  .drive-file-list { max-height: 200px; overflow-y: auto; margin: 8px 0; }
  .drive-file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    transition: background 0.1s;
  }
  .drive-file-item:hover { background: var(--surface2); border-color: var(--accent); }
  .drive-file-item i { color: #4285F4; font-size: 18px; flex-shrink: 0; }
  .drive-file-item .dfi-name { font-size: 13px; font-weight: 500; flex: 1; }
  .drive-file-item .dfi-date { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar .nav-item span, .sidebar .nav-label, .sidebar-logo .brand, .sidebar-logo .sub, .nav-item .badge { display: none; }
    .main { margin-left: 60px; }
    .chart-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
/* ══════════════════════════════════
   MOBILE PWA — CONSTRUCTION TRACKER
══════════════════════════════════ */
@media (max-width: 768px) {

  html, body { overflow-x: hidden; }

  /* Fix body flex collapsing on mobile */
  body { display: block !important; padding-bottom: 70px; }

  /* Hide desktop sidebar completely */
  .sidebar { display: none !important; }

  /* Main takes full width */
  .main {
    margin-left: 0 !important;
    width: 100% !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Topbar compact */
  .topbar { padding: 0 12px; height: 48px; }
  .topbar-title { font-size: 13px; }
  .topbar-title span { display: none; }

  /* Content padding reduced */
  .content { padding: 12px !important; }

  /* Stats grid — 2 columns */
  .stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
  }

  /* Stat cards compact */
  .stat-card { padding: 12px 10px !important; }
  .stat-value { font-size: 16px !important; }
  .stat-label { font-size: 10px !important; }

  /* Tables horizontal scroll */
  .table-wrap,
  .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 500px; font-size: 11px; }
  thead th { padding: 8px 10px; font-size: 10px; }
  tbody td { padding: 8px 10px; }

  /* Cards full width */
  .card { border-radius: 10px; margin-bottom: 10px; }

  /* Buttons full width on mobile */
  .btn-primary, .btn { font-size: 12px; }

  /* Forms single column */
  .form-grid { grid-template-columns: 1fr !important; gap: 10px !important; }

  /* Modal full screen */
  .modal { width: 96% !important; max-width: 100% !important; border-radius: 12px; }

  /* Section title smaller */
  .section-title { font-size: 14px !important; margin-bottom: 12px !important; }

  /* Bottom padding for nav bar */
  body { padding-bottom: 70px; }

  /* ── BOTTOM NAVIGATION ── */
  .bottom-nav {
    display: flex !important;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
    z-index: 999;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bnav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 6px 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .bnav-icon { font-size: 18px; line-height: 1; }
  .bnav-label {
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.4px;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .bnav-item.active { color: var(--accent); }
  .bnav-item.active .bnav-icon {
    transform: translateY(-2px);
    filter: drop-shadow(0 0 5px rgba(79,134,247,0.7));
  }

  /* More menu popup */
  .more-menu {
    position: fixed;
    bottom: 68px;
    right: 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    z-index: 1000;
    min-width: 200px;
    overflow: hidden;
    display: none;
    animation: menuIn 0.15s ease;
  }
  .more-menu.open { display: block; }
  @keyframes menuIn {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .more-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    background: transparent;
    border: none;

    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
  }
  .more-menu-item:last-child { border-bottom: none; }
  .more-menu-item:active { background: var(--surface3); }
  .more-menu-item i { font-size: 16px; color: var(--accent); }

  .more-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 998;
  }
  .more-backdrop.open { display: block; }
}

/* Hide bottom nav on desktop */
.bottom-nav { display: none; }

<script>
const STORE_KEY = 'alahmed_construction_v2';
let data = [];
let currentFilters = { all: 'all', workers: 'all' };
let currentPage = 'dashboard';

function load() {
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { data = []; }
  if (data.length === 0) seedData();
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

function seedData() {
  const today = new Date();
  const d = (offset) => {
    const dt = new Date(today);
    dt.setDate(dt.getDate() - offset);
    return dt.toISOString().split('T')[0];
  };
  data = [
    { id: uid(), date: d(20), category: 'Raghu Contractor', worker: 'Raghu', desc: 'Foundation work advance', payment: 'Cash', status: 'Paid', amount: 50000, remarks: 'First advance' },
    { id: uid(), date: d(15), category: 'Raghu Contractor', worker: 'Raghu', desc: 'Column & slab work – Phase 1', payment: 'Online', status: 'Paid', amount: 75000, remarks: 'NEFT transfer' },
    { id: uid(), date: d(10), category: 'Material', worker: 'Harnai Building Supplies', desc: 'AAC blocks – 500 pcs', payment: 'Credit', status: 'Pending', amount: 32000, remarks: 'Credit from shop' },
    { id: uid(), date: d(8), category: 'Masonry', worker: 'Rafiq', desc: 'Block laying – ground floor', payment: 'Cash', status: 'Paid', amount: 8500, remarks: '' },
    { id: uid(), date: d(6), category: 'Material', worker: 'Dapoli Steel', desc: 'TMT steel 12mm – 200 kg', payment: 'Online', status: 'Paid', amount: 18000, remarks: 'GPay' },
    { id: uid(), date: d(4), category: 'Electrical', worker: 'Suresh Electrician', desc: 'Conduit pipe laying – ground floor', payment: 'Cash', status: 'Paid', amount: 6000, remarks: '' },
    { id: uid(), date: d(3), category: 'Plumbing', worker: 'Salim Plumber', desc: 'Water supply pipe – underground', payment: 'Cash', status: 'Paid', amount: 4500, remarks: '' },
    { id: uid(), date: d(2), category: 'Brick Work', worker: 'Nandu', desc: 'Red brick external wall', payment: 'Cash', status: 'Partial', amount: 7000, remarks: '₹3500 pending' },
    { id: uid(), date: d(1), category: 'Raghu Contractor', worker: 'Raghu', desc: 'Staircase slab – Phase 2', payment: 'Cash', status: 'Paid', amount: 40000, remarks: 'C7-C10 columns' },
    { id: uid(), date: d(0), category: 'Other', worker: 'Misc', desc: 'Sand & aggregate delivery charges', payment: 'Cash', status: 'Paid', amount: 2200, remarks: '' },
  ];
  save();
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function fmt(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return d + '/' + m + '/' + y.slice(2);
}

function payBadge(p) {
  const map = { Cash: 'badge-cash', Online: 'badge-online', Credit: 'badge-credit' };
  const icon = { Cash: 'ti-cash', Online: 'ti-wifi', Credit: 'ti-credit-card' };
  return `<span class="badge ${map[p]||''}"><i class="ti ${icon[p]||'ti-circle'}" aria-hidden="true"></i>${p}</span>`;
}
function statusBadge(s) {
  const map = { Paid: 'badge-paid', Pending: 'badge-pending', Partial: 'badge-partial' };
  return `<span class="badge ${map[s]||''}">${s}</span>`;
}
function catBadge(c) {
  const map = { 'Raghu Contractor': 'badge-contractor', 'Material': 'badge-material' };
  const def = 'badge-labour';
  return `<span class="badge ${map[c]||def}">${c}</span>`;
}

function actionBtns(id) {
  return `<div class="action-btns">
    <button class="edit-btn" onclick="editEntry('${id}')" title="Edit"><i class="ti ti-pencil" aria-hidden="true"></i></button>
    <button class="delete-btn" onclick="deleteEntry('${id}')" title="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
  </div>`;
}

function clickableStatus(id, status) {
  const map = { Paid: 'badge-paid', Pending: 'badge-pending', Partial: 'badge-partial' };
  const tip = { Paid: 'Click to mark Pending', Pending: 'Click to mark Paid', Partial: 'Click to mark Paid' };
  return `<span class="badge ${map[status]||''} status-toggle" onclick="quickStatusChange('${id}')" title="${tip[status]||'Change status'}" style="cursor:pointer">
    ${status === 'Paid' ? '<i class="ti ti-check" aria-hidden="true"></i>' : status === 'Pending' ? '<i class="ti ti-clock" aria-hidden="true"></i>' : '<i class="ti ti-adjustments" aria-hidden="true"></i>'}
    ${status}
  </span>`;
}

// NAVIGATION
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name)?.classList.add('active');
  currentPage = name;
  const titles = {
    dashboard: 'Dashboard', all: 'All Expenses', raghu: 'Raghu Contractor',
    workers: 'Workers', material: 'Materials', masonry: 'Masonry Work',
    electrical: 'Electrical Work', plumbing: 'Plumbing Work', brickwork: 'Brick Work', other: 'Other Work'
  };
  document.getElementById('topbar-title').innerHTML = titles[name] + ' <span>Harnai Construction Project</span>';
  renderPage(name);

  // Bottom nav sync
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  const bmap = {
    dashboard: 'bnav-dashboard', all: 'bnav-all',
    raghu: 'bnav-more', workers: 'bnav-workers',
    material: 'bnav-material',
    masonry: 'bnav-more', electrical: 'bnav-more',
    plumbing: 'bnav-more', brickwork: 'bnav-more', other: 'bnav-more'
  };
  const bel = document.getElementById(bmap[name]);
  if (bel) bel.classList.add('active');
  closeMore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPage(name) {
  switch(name) {
    case 'dashboard': renderDashboard(); break;
    case 'all': renderAll(); break;
    case 'raghu': renderRaghu(); break;
    case 'workers': renderWorkers(); break;
    case 'material': renderMaterial(); break;
    case 'masonry': renderCategory('masonry', 'Masonry'); break;
    case 'electrical': renderCategory('electrical', 'Electrical'); break;
    case 'plumbing': renderCategory('plumbing', 'Plumbing'); break;
    case 'brickwork': renderCategory('brickwork', 'Brick Work'); break;
    case 'other': renderCategory('other', 'Other'); break;
  }
  updateBadges();
}

function updateBadges() {
  document.getElementById('badge-all').textContent = data.length;

let editingId = null;

function editEntry(id) {
  const row = data.find(d => d.id === id);
  if (!row) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('modal-icon').className = 'ti ti-pencil';
  document.getElementById('modal-icon').style.color = 'var(--amber)';
  document.getElementById('f-date').value = row.date;
  document.getElementById('f-amount').value = row.amount;
  document.getElementById('f-category').value = row.category;
  document.getElementById('f-desc').value = row.desc;
  document.getElementById('f-payment').value = row.payment;
  document.getElementById('f-status').value = row.status;
  document.getElementById('f-remarks').value = row.remarks || '';
  // Set worker label correctly without overwriting the value
  const wg = document.getElementById('worker-group');
  const wl = document.getElementById('worker-label');
  if (row.category === 'Raghu Contractor') {
    wg.style.display = 'none';
    document.getElementById('f-worker').value = row.worker || 'Raghu';
  } else {
    wg.style.display = '';
    wl.textContent = row.category === 'Material' ? 'Shop Name' : 'Worker Name';
    document.getElementById('f-worker').value = row.worker || '';
  }
  // Handle partial payment
  const paid = getPaid(row);
  document.getElementById('f-paid').value = row.status === 'Partial' ? paid : '';
  if (row.status === 'Partial') {
    document.getElementById('partial-box').classList.add('show');
    onAmountChange();
  } else {
    document.getElementById('partial-box').classList.remove('show');
  }
  document.getElementById('modal').classList.add('open');
}

// Quick status change — one click toggles to Paid
function quickStatusChange(id) {
  const row = data.find(d => d.id === id);
  if (!row) return;
  const next = { Pending: 'Paid', Partial: 'Paid', Paid: 'Pending' };
  row.status = next[row.status] || 'Paid';
  // Update paid_amount accordingly
  if (row.status === 'Paid') row.paid_amount = +row.amount;
  else if (row.status === 'Pending') row.paid_amount = 0;
  save();
  showToast('Status changed to ' + row.status);
  renderPage(currentPage);
}

function openModalForRaghu() {
  openModal();
  document.getElementById('f-category').value = 'Raghu Contractor';
  onCategoryChange();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function onStatusChange() {
  const status = document.getElementById('f-status').value;
  const box = document.getElementById('partial-box');
  const boxLabel = document.getElementById('partial-box-label');
  if (status === 'Partial') {
    box.classList.add('show');
    if (boxLabel) boxLabel.textContent = '💰 Amount Paid so far (out of total)';
    onAmountChange();
  } else if (status === 'Pending') {
    // Hide partial box, reset paid to 0
    box.classList.remove('show');
    document.getElementById('f-paid').value = '';
  } else {
    // Paid — hide box, set paid = total
    box.classList.remove('show');
    const total = parseFloat(document.getElementById('f-amount').value) || 0;
    document.getElementById('f-paid').value = total;
  }
}

function onAmountChange() {
  const total = parseFloat(document.getElementById('f-amount').value) || 0;
  const paid = parseFloat(document.getElementById('f-paid').value) || 0;
  const remaining = total - paid;
  document.getElementById('partial-remaining').textContent = 'Remaining: ₹' + remaining.toLocaleString('en-IN');
  // Auto-upgrade status if paid >= total
  if (paid >= total && total > 0) {
    document.getElementById('f-status').value = 'Paid';
    document.getElementById('partial-box').classList.remove('show');
  }
}

// Helper: get paid amount from entry (backward compat — old entries have no paid_amount)
function getPaid(row) {
  if (row.status === 'Paid') return +row.amount;
  if (row.status === 'Pending') return 0;
  // Partial
  return row.paid_amount !== undefined ? +row.paid_amount : 0;
}
function getRemaining(row) { return Math.max(0, +row.amount - getPaid(row)); }

function onCategoryChange() {
  const cat = document.getElementById('f-category').value;
  const wg = document.getElementById('worker-group');
  const wl = document.getElementById('worker-label');
  if (cat === 'Raghu Contractor') {
    document.getElementById('f-worker').value = 'Raghu';
    wg.style.display = 'none';
  } else if (cat === 'Material') {
    wg.style.display = '';
    wl.textContent = 'Shop Name';
  } else {
    wg.style.display = '';
    wl.textContent = 'Worker Name';
  }
}

function saveEntry() {
  const date = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  const category = document.getElementById('f-category').value;
  const desc = document.getElementById('f-desc').value.trim();
  const payment = document.getElementById('f-payment').value;
  const status = document.getElementById('f-status').value;
  const worker = document.getElementById('f-worker').value.trim();
  const remarks = document.getElementById('f-remarks').value.trim();
  const paidInput = parseFloat(document.getElementById('f-paid').value);

  if (!date || !amount || !category || !desc) {
    alert('Please fill Date, Amount, Category, and Description.');
    return;
  }

  // Calculate paid_amount based on status
  let paid_amount;
  if (status === 'Paid') paid_amount = amount;
  else if (status === 'Pending') paid_amount = 0;
  else paid_amount = isNaN(paidInput) ? 0 : paidInput; // Partial

  // Validate partial
  if (status === 'Partial' && paid_amount >= amount) {
    alert('Paid amount cannot be equal or more than total. Change status to Paid.');
    return;
  }
  if (status === 'Partial' && paid_amount <= 0) {
    alert('Please enter the amount paid so far.');
    return;
  }

  if (editingId) {
    const idx = data.findIndex(d => d.id === editingId);
    if (idx !== -1) {
      data[idx] = { ...data[idx], date, category, worker, desc, payment, status, amount, paid_amount, remarks };
    }
    showToast('Entry updated successfully!');
  } else {
    data.push({ id: uid(), date, category, worker, desc, payment, status, amount, paid_amount, remarks });
    showToast('Entry saved successfully!');
  }
  editingId = null;
  save();
  closeModal();
  renderPage(currentPage);
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  data = data.filter(d => d.id !== id);
  save();
  showToast('Entry deleted.');
  renderPage(currentPage);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function exportCSV() {
  const headers = ['Date','Category','Worker/Shop','Description','Payment','Status','Amount','Remarks'];
  const rows = data.map(d => [d.date,d.category,d.worker,d.desc,d.payment,d.status,d.amount,d.remarks].map(v => `"${v||''}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'al-ahmed-construction-expenses.csv';
  a.click();
}

// GOOGLE DRIVE INTEGRATION
// Uses Google Identity Services + Drive REST API
// ═══════════════════════════════════════════════

const DRIVE_CLIENT_ID = '216032794821-d77ggkvn0lbrr3nlffhce9uanh31oh1e.apps.googleusercontent.com';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file';
const BACKUP_FOLDER = 'Al Ahmed Construction Tracker';
const BACKUP_FILENAME = 'construction-backup.json';

let driveToken = null;
let driveUser = null;
let gisInited = false;
let gapiInited = false;
let tokenClient = null;

// Called when gsi/client script loads
function initGis() {
  if (!DRIVE_CLIENT_ID) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPES,
    callback: (resp) => {
      if (resp.error) { driveSetStatus('Auth error: ' + resp.error, false); return; }
      driveToken = resp.access_token;
      localStorage.setItem('drive_token', driveToken);
      driveSetStatus('Connected', true);
      showDriveConnected();
    }
  });
  gisInited = true;
  // Auto-restore token from localStorage
  const saved = localStorage.getItem('drive_token');
  if (saved) { driveToken = saved; driveSetStatus('Connected', true); showDriveConnected(); }
}

function initGapi() {
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
  });
}

// Wait for scripts to load, then init
window.addEventListener('load', () => {
  setTimeout(() => {
    if (typeof google !== 'undefined' && google.accounts) initGis();
    if (typeof gapi !== 'undefined') initGapi();
  }, 1500);
});

function driveSignIn() {
  if (!DRIVE_CLIENT_ID) {
    showDriveSetupGuide();
    return;
  }
  if (!tokenClient) { showToast('Google API not loaded yet, try again'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function driveSignOut() {
  if (driveToken) google.accounts.oauth2.revoke(driveToken, () => {});
  driveToken = null;
  driveUser = null;
  localStorage.removeItem('drive_token');
  driveSetStatus('Not connected', false);
  document.getElementById('drive-signin-btn').style.display = '';
  document.getElementById('drive-backup-btn').style.display = 'none';
  document.getElementById('drive-restore-btn').style.display = 'none';
  document.getElementById('drive-signout-btn').style.display = 'none';
  document.getElementById('topbar-drive-btn').style.display = 'none';
}

function showDriveConnected() {
  document.getElementById('drive-signin-btn').style.display = 'none';
  document.getElementById('drive-backup-btn').style.display = '';
  document.getElementById('drive-restore-btn').style.display = '';
  document.getElementById('drive-signout-btn').style.display = '';
  document.getElementById('topbar-drive-btn').style.display = '';
}

function driveSetStatus(msg, ok) {
  const el = document.getElementById('drive-status');
  el.textContent = msg;
  el.className = 'drive-status' + (ok ? ' connected' : '');
}

// ── BACKUP ──
async function driveBackup() {
  if (!driveToken) { showToast('Sign in to Google Drive first'); return; }
  driveSetStatus('Saving...', false);
  try {
    const folderId = await getOrCreateFolder();
    const fileId = await findBackupFile(folderId);
    const payload = JSON.stringify({ data, savedAt: new Date().toISOString(), entries: data.length });
    if (fileId) {
      await updateDriveFile(fileId, payload);
    } else {
      await createDriveFile(folderId, payload);
    }
    const now = new Date();
    const ts = fmtDate(now.toISOString().split('T')[0]) + ' ' + now.toTimeString().slice(0,5);
    driveSetStatus('Saved: ' + ts, true);
    localStorage.setItem('drive_last_backup', ts);
    showToast('Backup saved to Google Drive!');
  } catch(e) {
    if (e.status === 401) { driveToken = null; localStorage.removeItem('drive_token'); driveSetStatus('Session expired — sign in again', false); showDriveSignedOut(); }
    else driveSetStatus('Error: ' + (e.message || 'Failed'), false);
  }
}

async function getOrCreateFolder() {
  const res = await driveReq('GET', `https://www.googleapis.com/drive/v3/files?q=name='${BACKUP_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id,name)`);
  if (res.files && res.files.length > 0) return res.files[0].id;
  const created = await driveReq('POST', 'https://www.googleapis.com/drive/v3/files', { name: BACKUP_FOLDER, mimeType: 'application/vnd.google-apps.folder' });
  return created.id;
}

async function findBackupFile(folderId) {
  const res = await driveReq('GET', `https://www.googleapis.com/drive/v3/files?q='${folderId}' in parents and name='${BACKUP_FILENAME}' and trashed=false&fields=files(id,name,modifiedTime)`);
  return (res.files && res.files.length > 0) ? res.files[0].id : null;
}

async function createDriveFile(folderId, content) {
  const meta = { name: BACKUP_FILENAME, parents: [folderId], mimeType: 'application/json' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', new Blob([content], { type: 'application/json' }));
  const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST', headers: { Authorization: 'Bearer ' + driveToken }, body: form
  });
  if (!resp.ok) throw { status: resp.status, message: await resp.text() };
  return resp.json();
}

async function updateDriveFile(fileId, content) {
  const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + driveToken, 'Content-Type': 'application/json' },
    body: content
  });
  if (!resp.ok) throw { status: resp.status, message: await resp.text() };
  return resp.json();
}

// ── RESTORE ──
async function openRestoreModal() {
  if (!driveToken) { showToast('Sign in to Google Drive first'); return; }
  document.getElementById('restore-modal').classList.add('open');
  document.getElementById('restore-msg').textContent = '';
  document.getElementById('restore-file-list').innerHTML = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px"><div class="spinner" style="margin:0 auto 10px"></div>Loading backups...</div>`;
  try {
    const folderId = await getOrCreateFolder();
    const res = await driveReq('GET', `https://www.googleapis.com/drive/v3/files?q='${folderId}' in parents and trashed=false&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime,size)`);
    const files = res.files || [];
    if (files.length === 0) {
      document.getElementById('restore-file-list').innerHTML = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No backups found in Drive.<br>Click "Backup Now" to create your first backup.</div>`;
      return;
    }
    document.getElementById('restore-file-list').innerHTML = files.map(f => {
      const dt = new Date(f.modifiedTime);
      const dateStr = fmtDate(dt.toISOString().split('T')[0]) + ' ' + dt.toTimeString().slice(0,5);
      const size = f.size ? Math.round(f.size/1024*10)/10 + ' KB' : '';
      return `<div class="drive-file-item" onclick="restoreFromFile('${f.id}','${f.name}')">
        <i class="ti ti-file-type-json" aria-hidden="true"></i>
        <div style="flex:1">
          <div class="dfi-name">${f.name}</div>
          <div class="dfi-date">${dateStr} ${size ? '· '+size : ''}</div>
        </div>
        <i class="ti ti-download" style="color:var(--text3);font-size:15px" aria-hidden="true"></i>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('restore-file-list').innerHTML = `<div style="text-align:center;padding:20px;color:var(--red);font-size:13px">Error loading files: ${e.message||'Check connection'}</div>`;
  }
}

async function restoreFromFile(fileId, fileName) {
  if (!confirm(`Restore from "${fileName}"?\n\nThis will REPLACE all current data. Cannot be undone.`)) return;
  document.getElementById('restore-msg').textContent = 'Restoring...';
  try {
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: 'Bearer ' + driveToken }
    });
    if (!resp.ok) throw new Error('Download failed');
    const json = await resp.json();
    if (!json.data || !Array.isArray(json.data)) throw new Error('Invalid backup file format');
    data = json.data;
    save();
    closeRestoreModal();
    showToast('Restored ' + data.length + ' entries from Drive!');
    renderPage(currentPage);
    updateBadges();
    driveSetStatus('Restored: ' + json.entries + ' entries', true);
  } catch(e) {
    document.getElementById('restore-msg').textContent = 'Error: ' + (e.message || 'Restore failed');
  }
}

function closeRestoreModal() { document.getElementById('restore-modal').classList.remove('open'); }

// ── UTIL ──
async function driveReq(method, url, body) {
  const opts = { method, headers: { Authorization: 'Bearer ' + driveToken, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(url, opts);
  if (!resp.ok) {
    const txt = await resp.text();
    throw { status: resp.status, message: txt };
  }
  return resp.json();
}

function showDriveSignedOut() {
  document.getElementById('drive-signin-btn').style.display = '';
  document.getElementById('drive-backup-btn').style.display = 'none';
  document.getElementById('drive-restore-btn').style.display = 'none';

}
